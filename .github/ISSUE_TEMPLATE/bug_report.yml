name: Bug report
description: Something in the CLI, the site, the API or the docs is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys, tokens or connection strings.
        For security problems, use the private report in the Security tab instead.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - CLI (trolley)
        - Website
        - HTTP API / MCP endpoint
        - Scenario content or scoring
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran, or the page and what you clicked.
      render: shell
  - type: input
    id: env
    attributes:
      label: Version and environment
      placeholder: "commit or release, Node version, OS, browser"
