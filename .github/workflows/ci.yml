name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build, test and content-validate on every platform a contributor might use.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # No `version:` here. pnpm/action-setup errors out if it is pinned in BOTH
      # places, and package.json's `packageManager` is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The ModeScoped brand (invariant 1) is a compile-time guarantee, so it is
      # checked by the type-checker rather than by a runtime assertion.
      - name: Typecheck invariant assertions
        run: pnpm exec tsc -p packages/spec/tsconfig.test.json

      - run: pnpm exec vitest run

      - name: Validate scenario packs
        run: node apps/cli/dist/index.js validate

      # THE PHASE 0 GATE. The lock is committed from one machine; every platform
      # rebuilds the suite and must arrive at byte-identical instance hashes. If
      # Windows and Linux ever disagree, exactly one of these jobs goes red.
      - name: Verify frozen suite digest
        run: node apps/cli/dist/index.js verify content/suites/canon-v0.yaml

      # A run must complete with no keys, no network and no config at all.
      - name: Offline end-to-end run
        run: node apps/cli/dist/index.js run --pack classic --model echo --provider echo --limit 8 --run-id ci

  # The same gate with CRLF bytes on disk - the classic way content hashing dies.
  #
  # This job used to provoke that with `core.autocrlf true` before checkout, and it never
  # worked: .gitattributes pins `eol=lf`, and .gitattributes beats core.autocrlf, so the
  # tree came out LF and the job asserted nothing. Rather than delete the guard, test the
  # invariant directly - rewrite content/ to CRLF on disk ourselves, then demand the same
  # digest. That exercises the canonicalizer (CRLF -> LF before hashing), which is the
  # actual guarantee, instead of exercising a git setting.
  hash-parity-crlf:
    name: hash parity (CRLF bytes on disk)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The committed tree must stay LF. If this pin is ever dropped, Windows
      # contributors start committing CRLF and the problem becomes real.
      - name: .gitattributes still pins LF
        shell: bash
        run: |
          grep -q 'text=auto eol=lf' .gitattributes || {
            echo "::error::.gitattributes no longer pins eol=lf"
            exit 1
          }

      # Corrupt the bytes ourselves, assert inside the script, then demand the same
      # digest. The script does its own verification because `grep -q $'\r'` reports no
      # match on Git Bash under windows-latest even when the bytes are plainly CR LF -
      # a shell guard here would pass without checking anything.
      - name: Rewrite every content file to CRLF
        run: node scripts/to-crlf.mjs content

      - name: Verify frozen suite digest despite CRLF
        run: node apps/cli/dist/index.js verify content/suites/canon-v0.yaml
