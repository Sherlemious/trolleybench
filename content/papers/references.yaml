# Bibliography. Every citekey in content/packs and content/baselines resolves here;
# packages/scenarios/test/baselines.test.ts fails if one does not.
#
# `checked` records who read the text at `against` and confirmed these details and any
# number quoted from it. `verified` stays false until a HUMAN has checked the published
# source - an agent's reading is recorded as `checked.by: agent`, never as verified.

